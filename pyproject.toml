[project]
name = "local-lke"
version = "0.4.0"
description = "A local-first, inspectable RAG workbench and future knowledge-management expert system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "gradio>=5.49,<7",
  "httpx>=0.28,<1",
  "langchain-core>=0.3.76,<2",
  "langchain-huggingface>=0.3.1,<2",
  "langchain-openai>=0.3.33,<2",
  "langchain-text-splitters>=0.3.11,<2",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5.9,<7",
  "python-multipart>=0.0.20,<1",
  "scikit-learn>=1.7,<2",
  "sentence-transformers>=5,<6",
  "sqlalchemy>=2.0.43,<3",
  "structlog>=25.4,<26",
  "unstructured[pdf]>=0.18.14,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
lke = "local_lke.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-socket>=0.7,<1",
  "reportlab>=4.4,<5",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_lke"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --disable-socket --allow-unix-socket"
testpaths = ["tests"]
markers = [
  "live: requires a running OpenAI-compatible local model and may initialize a real embedding model",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["local_lke"]
